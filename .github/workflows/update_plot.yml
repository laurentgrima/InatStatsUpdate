name: Generer barplot Inat Lycées

on:
  schedule:
    - cron: "0 0 * * *"   
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ runner.os }}/Library/R/4.5
          key: ${{ runner.os }}-r-${{ hashFiles('**/*.R') }}

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(
            c("ggplot2","dplyr","tidyr","tibble","purrr","jsonlite","httr"),
            repos = "https://cloud.r-project.org"
          )'

      - name: Run R script
        run: Rscript generate_plot_lycee.R

      - name: Check generated files
        run: ls -l

      - name: Commit and push plot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase origin main
          git add barplot_lycee_valeurs.png
          git commit -m "Update barplot lycee" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main
