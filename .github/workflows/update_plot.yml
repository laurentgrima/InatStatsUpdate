name: Generate random plot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install ggplot2 (minimal)
        run: |
          Rscript -e 'install.packages("ggplot2", repos="https://cloud.r-project.org", dependencies = FALSE)'

      - name: Run script
        run: Rscript generate_plot.R

      - name: Commit and push plot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add plot.png
          git commit -m "Update plot" || echo "No changes"
          git push
