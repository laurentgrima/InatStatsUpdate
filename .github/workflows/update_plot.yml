name: Generer graph Inat Projet CNC

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "ggplot2", "cli", "gtable", "isoband", "lifecycle", 
            "rlang", "S7", "scales", "vctrs", "withr, dplyr, jsonlite, httr"
          ), repos="https://cloud.r-project.org")'

      - name: Run R script
        run: Rscript generate_plot.R

      - name: Check generated files
        run: ls -l

      - name: Commit and push plot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add plot.png
          git commit -m "Update plot" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main
